<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workday My Information (fixture)</title>
  </head>
  <body>
    <!-- Markup mirrors real Workday "My Information" fields captured from a live posting:
         each text input lives inside a formField-* wrapper div. -->
    <div data-automation-id="applyFlowMyInfoPage">
      <div data-automation-id="formField-legalName--firstName">
        <label>First Name</label><input name="legalName--firstName" type="text" />
      </div>
      <div data-automation-id="formField-legalName--lastName">
        <label>Last Name</label><input name="legalName--lastName" type="text" />
      </div>
      <div data-automation-id="formField-addressLine1">
        <label>Address Line 1</label><input name="addressLine1" type="text" />
      </div>
      <div data-automation-id="formField-phoneNumber">
        <label>Phone Number</label><input name="phoneNumber" type="text" />
      </div>
      <!-- My Experience fields (same native-setter path; shown together for the test). -->
      <div data-automation-id="formField-jobTitle">
        <label>Job Title</label><input name="jobTitle" type="text" />
      </div>
      <div data-automation-id="formField-companyName">
        <label>Company</label><input name="companyName" type="text" />
      </div>
      <div data-automation-id="formField-roleDescription">
        <label>Role Description</label><textarea name="roleDescription"></textarea>
      </div>
      <div data-automation-id="formField-linkedInAccount">
        <label>LinkedIn</label><input name="linkedInAccount" type="text" />
      </div>
      <button data-automation-id="pageFooterNextButton" type="button">Save and Continue</button>
    </div>

    <script>
      // Controlled-input trap: simulate a React-controlled field. The "committed" value
      // (what the app state would hold) is mirrored into data-committed ONLY when a real
      // `input` event fires. A raw `el.value = x` without dispatching events does NOT
      // update it — exactly the failure the native-setter path must overcome.
      for (const input of document.querySelectorAll('input, textarea')) {
        input.dataset.committed = '';
        input.addEventListener('input', (e) => {
          e.target.dataset.committed = e.target.value;
        });
      }
      // Track whether the form was ever submitted/advanced (must stay false).
      window.__submitted = false;
      document
        .querySelector('[data-automation-id="pageFooterNextButton"]')
        .addEventListener('click', () => {
          window.__submitted = true;
        });
    </script>
  </body>
</html>
