<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workday widgets (fixture)</title>
  </head>
  <body>
    <div data-automation-id="applyFlowMyExperiencePage">
      <div data-automation-id="formField-currentlyWorkHere">
        <label>Currently work here</label><input name="currentlyWorkHere" type="checkbox" />
      </div>
      <div data-automation-id="formField-degree">
        <label>Degree</label><button type="button" name="degree">Select One</button>
      </div>
      <div data-automation-id="formField-skills">
        <label>Skills</label>
        <ul class="chips"></ul>
        <input type="text" name="skills" />
      </div>
      <div data-automation-id="formField-startDate">
        <label>Start Date</label>
        <input data-automation-id="dateSectionMonth-input" aria-label="Month" />
        <input data-automation-id="dateSectionYear-input" aria-label="Year" />
      </div>
      <button data-automation-id="pageFooterNextButton" type="button">Save and Continue</button>
    </div>

    <script>
      // Model Workday: options render in a portal at document root (promptOption items).
      const DEGREES = ['Bachelor of Science', 'Master of Science', 'PhD'];
      const SKILLS = ['Algorithms', 'Calculus', 'Fortran', 'Python'];

      // Controlled-state mirrors (data-committed), updated only on real events.
      for (const el of document.querySelectorAll('input, textarea')) {
        el.dataset.committed = '';
        el.addEventListener('input', (e) => (e.target.dataset.committed = e.target.value));
        el.addEventListener('change', (e) => {
          if (e.target.type === 'checkbox') e.target.dataset.committed = String(e.target.checked);
        });
      }

      function portal() {
        let p = document.getElementById('wd-portal');
        if (!p) {
          p = document.createElement('div');
          p.id = 'wd-portal';
          document.body.appendChild(p);
        }
        return p;
      }
      function clearPortal() {
        const p = document.getElementById('wd-portal');
        if (p) p.innerHTML = '';
      }
      function renderOptions(items, onPick) {
        const p = portal();
        p.innerHTML = '';
        for (const text of items) {
          const o = document.createElement('div');
          o.setAttribute('data-automation-id', 'promptOption');
          o.textContent = text;
          o.addEventListener('click', () => onPick(text));
          p.appendChild(o);
        }
      }

      // Degree: click button → full option list; pick sets the button value.
      const degBtn = document.querySelector('[data-automation-id="formField-degree"] button');
      degBtn.addEventListener('click', () =>
        renderOptions(DEGREES, (text) => {
          degBtn.textContent = text;
          degBtn.dataset.selected = text;
          clearPortal();
        }),
      );

      // Skills: typing filters options; pick appends a chip and clears the input.
      const skInput = document.querySelector('[data-automation-id="formField-skills"] input');
      const chips = document.querySelector('[data-automation-id="formField-skills"] .chips');
      skInput.addEventListener('input', () => {
        const v = skInput.value.trim().toLowerCase();
        if (!v) return clearPortal();
        renderOptions(
          SKILLS.filter((s) => s.toLowerCase().includes(v)),
          (text) => {
            const li = document.createElement('li');
            li.setAttribute('data-automation-id', 'selectedItem');
            li.textContent = text;
            chips.appendChild(li);
            clearPortal();
          },
        );
      });

      window.__submitted = false;
      document
        .querySelector('[data-automation-id="pageFooterNextButton"]')
        .addEventListener('click', () => (window.__submitted = true));
    </script>
  </body>
</html>
